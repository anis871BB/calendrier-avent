<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un mois de surprises ✨</title>
<style>
:root{--wine:#762f45;--cream:#fff8ed;--gold:#d8ad62;--ink:#432d32}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Georgia,serif;color:var(--ink);background:radial-gradient(circle at top,#fff9ef 0,#f2e3d5 55%,#e8d4c6 100%);padding:32px 16px}
main{max-width:850px;margin:auto;text-align:center}
.kicker{letter-spacing:.22em;text-transform:uppercase;font:11px Arial,sans-serif;color:var(--wine)}
h1{font-size:clamp(2.3rem,7vw,4.3rem);font-weight:400;margin:12px 0 8px;color:var(--wine)}
.intro{font-size:1.08rem;line-height:1.6;max-width:560px;margin:0 auto 28px}
.counter{font:12px Arial,sans-serif;letter-spacing:.08em;color:#795d5d;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.door{min-height:125px;border:1px solid #e3c99d;border-radius:15px;background:linear-gradient(145deg,#fffdf7,#f8ead5);box-shadow:0 5px 14px #68412b16;color:var(--wine);cursor:pointer;padding:12px;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.door:not(:disabled):hover{transform:translateY(-4px);box-shadow:0 9px 20px #68412b25}
.door:disabled{cursor:not-allowed;opacity:.62;background:linear-gradient(145deg,#e8dfd4,#d9cfc3);color:#766b65;border-color:#d2c5b8}
.num{font: bold 30px Georgia,serif}
.symbol{font-size:20px;margin-top:5px}
.door small{font:10px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;margin-top:7px}
footer{margin-top:28px;font:12px Arial,sans-serif;color:#806a66}
dialog{border:1px solid var(--gold);border-radius:20px;max-width:min(90vw,430px);padding:32px;background:var(--cream);color:var(--ink);text-align:center;box-shadow:0 18px 60px #321b1b44}
dialog::backdrop{background:#27161a99;backdrop-filter:blur(3px)}
dialog h2{font-weight:400;color:var(--wine);font-size:1.8rem;margin:0 0 14px}
#clue{font-size:1.2rem;line-height:1.6}
.close{margin-top:22px;border:0;border-radius:30px;background:var(--wine);color:white;padding:11px 22px;font-size:14px;cursor:pointer}
@media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr);gap:9px}.door{min-height:105px}.num{font-size:26px}}
</style>
</head>
<body>
<main>
  <div class="kicker">Pour toi, avec amour</div>
  <h1>24 jours de magie ✨</h1>
  <p class="intro">Chaque jour, une petite porte s'ouvre… et un nouvel indice t'attend pour deviner ton cadeau. ❤️</p>
  <div class="counter" id="counter">Le calendrier commence le 1er décembre 2026</div>
  <section class="grid" id="calendar" aria-label="Calendrier de l'Avent"></section>
  <footer>Une surprise par jour, juste pour toi · Décembre 2026</footer>
</main>
<dialog id="popup">
  <div class="kicker" id="dayLabel">1er décembre</div>
  <h2>Ton indice du jour 💌</h2>
  <p id="clue"></p>
  <button class="close" id="close">Je garde le mystère</button>
</dialog>
<script>
const YEAR = 2026;
// Remplace les textes ci-dessous par tes propres indices.
const clues = [
"Un premier petit indice t'attend ici…",
"Ça pourrait rendre tes journées encore plus douces.",
"Un détail que tu pourras garder près de toi.",
"Il y a peut-être une histoire de goût là-dessous.",
"Un indice qui se porte, ou presque…",
"Tu pourrais en avoir besoin lors d'une prochaine sortie.",
"Quelque chose choisi spécialement pour toi.",
"Un petit plaisir qui se savoure.",
"Ça pourrait te faire penser à moi.",
"Un objet, mais pas tout à fait ordinaire.",
"Il y a une touche de confort dans cette surprise.",
"Un indice : regarde du côté de tes passions.",
"Ça tient peut-être dans la main.",
"Un petit quelque chose pour prendre du temps pour toi.",
"Une surprise qui a du caractère.",
"Tu pourrais l'emporter avec toi.",
"Un détail qui devrait te plaire au quotidien.",
"Il se pourrait que ça réveille un souvenir.",
"Une surprise à découvrir tranquillement.",
"Ça pourrait accompagner un joli moment à deux.",
"Un indice tout doux pour patienter encore un peu.",
"On approche… pense à ce qui te fait sourire.",
"Demain, le mystère sera presque levé !",
"Joyeux Noël mon amour ❤️ Voici ton dernier indice !"
];
const today = new Date();
const isThisDecember = today.getFullYear() === YEAR && today.getMonth() === 11;
const unlocked = isThisDecember ? today.getDate() : (today.getFullYear() > YEAR ? 24 : 0);
const grid = document.getElementById("calendar");
const popup = document.getElementById("popup");
const counter = document.getElementById("counter");
counter.textContent = unlocked === 0
 ? "Rendez-vous le 1er décembre 2026 pour ouvrir la première case ❤️"
 : unlocked === 24
 ? "Les 24 indices sont maintenant à toi ❤️"
 : `${unlocked} case${unlocked>1?"s":""} ${unlocked>1?"ouvertes":"ouverte"} · La suite arrive jour après jour`;
const labels = ["1er décembre", ...Array.from({length:23},(_,i)=>`${i+2} décembre`)];
clues.forEach((clue,i)=>{
  const day=i+1, canOpen=day<=unlocked;
  const button=document.createElement("button");
  button.className="door"; button.disabled=!canOpen;
  button.setAttribute("aria-label", canOpen ? `Ouvrir la case ${day}` : `Case ${day}, pas encore disponible`);
  button.innerHTML=`<span class="num">${String(day).padStart(2,"0")}</span><span class="symbol">${canOpen?"✦":"❄"}</span><small>${canOpen?"À découvrir":"Bientôt"}</small>`;
  button.addEventListener("click",()=>{
    document.getElementById("dayLabel").textContent=labels[i];
    document.getElementById("clue").textContent=clue;
    popup.showModal();
  });
  grid.appendChild(button);
});
document.getElementById("close").addEventListener("click",()=>popup.close());
</script>
</body>
</html>
